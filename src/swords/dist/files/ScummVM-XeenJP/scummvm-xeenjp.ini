[scummvm]
# 日本語の字の形: shinonome（東雲フォント 12 ドット）または misaki（美咲フォント 8 ドット）
# ゲーム中に F11 キーを押しても切り替わります（ここに書き込まれます）
xeen_ja_font=shinonome
# 音楽: 最初は AdLib の音です。MIDI（MT-32 の音源）で鳴らすときは、下の行の先頭の # を消してください
# windows は Windows の最初の MIDI 出力です。ほかの出力を使うときは「windows_出力の名前」と書きます
# （例: Munt の MT-32 Synth Emulator なら mt32_device=windows_MT-32 Synth Emulator）
#mt32_device=windows
fullscreen=false
subtitles=true
confirm_exit=false
gui_return_to_launcher_at_exit=false
